# Server
server.port=8082

# Application
spring.application.name=payment-api

# Datasource
spring.datasource.url=jdbc:postgresql://localhost:5433/payment
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-test-query=select 1

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Spring Cloud Stream - Kafka Binder
spring.cloud.stream.kafka.binder.autoCreateTopics=true
spring.cloud.stream.kafka.binder.brokers=localhost:9092

# Function (bean checkoutCreated)
spring.cloud.function.definition=checkoutCreated

# Bindings
spring.cloud.stream.bindings.checkoutCreated-in-0.binder=kafka
spring.cloud.stream.bindings.checkoutCreated-in-0.destination=streaming.ecommerce.checkout.created
spring.cloud.stream.bindings.checkoutCreated-in-0.group=${spring.application.name}
spring.cloud.stream.bindings.checkoutCreated-in-0.content-type=application/json

spring.cloud.stream.bindings.checkoutCreated-out-0.binder=kafka
spring.cloud.stream.bindings.checkoutCreated-out-0.destination=streaming.ecommerce.payment.paid
spring.cloud.stream.bindings.checkoutCreated-out-0.content-type=application/json